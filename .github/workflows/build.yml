name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: blast
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name != github.repository }}
          pathsToPush: "image-legacy image-uefi"

      - name: Check Nix flake
        run: nix flake check --keep-going --print-build-logs

      - name: Build disk images
        run: |
          nix build --print-build-logs .#legacy --out-link image-legacy
          nix build --print-build-logs .#uefi --out-link image-uefi
